name: "Bindgen"

on:
  workflow_call:

jobs:
  bindgen-ffi-job:
    name: "Bindgen AST"
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows, os: windows-latest, rid: win }
          - { name: macOS, os: macos-latest, rid: osx }
          - { name: Linux, os: ubuntu-latest, rid: linux }

    steps:
      - name: "Clone Git repository"
        uses: actions/checkout@v2
        with:
          submodules: "true"

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x          

      - name: "Install c2ffi"
        shell: bash
        run: dotnet tool install --global bottlenoselabs.c2ffi.Tool

      - name: "Read C code: Linux dependencies"
        if: runner.os == 'Linux'
        run: sudo apt-get install gcc-aarch64-linux-gnu

      - name: "Read C code: extract ${{ matrix.platform.rid }}"
        shell: bash
        run: cd ./bindgen && ./extract.sh

      - name: "Upload C code platform abstract syntax trees"
        uses: actions/upload-artifact@v4
        with:
          name: "ffi-${{ matrix.platform.rid }}"
          path: "./bindgen/ffi"

  bindgen-cross-platform-ffi-job:
    name: "Bindgen AST cross-platform"
    needs: [bindgen-ffi-job]
    runs-on: ubuntu-latest

    steps:
      - name: "Clone Git repository"
        uses: actions/checkout@v2
        with:
          submodules: "false"

      - name: "Download C code platform abstract syntax trees (win)"
        uses: actions/download-artifact@v4
        with:
          name: "ffi-win"
          path: "./bindgen/ffi"

      - name: "Download C code platform abstract syntax trees (osx)"
        uses: actions/download-artifact@v4
        with:
          name: "ffi-osx"
          path: "./bindgen/ffi"

      - name: "Download C code platform abstract syntax trees (linux)"
        uses: actions/download-artifact@v4
        with:
          name: "ffi-linux"
          path: "./bindgen/ffi"

      - name: "Install c2ffi"
        shell: bash
        run: dotnet tool install --global bottlenoselabs.c2ffi.Tool

      - name: "Generate cross-platform AST"
        shell: bash
        run: cd ./bindgen && ./merge.sh

      - name: "Upload cross-platform AST"
        uses: actions/upload-artifact@v4
        with:
          name: "ffi-cross-platform"
          path: "./bindgen/x-ffi/ffi-cross-platform.json"

  bindgen-cs-job:
    name: "Bindgen C#"
    needs: [bindgen-cross-platform-ffi-job]
    runs-on: ubuntu-latest

    steps:
      - name: "Clone Git repository"
        uses: actions/checkout@v2
        with:
          submodules: "false"

      - name: "Download C code cross-platform abstract syntax tree"
        uses: actions/download-artifact@v4
        with:
          name: "ffi-cross-platform"
          path: "./bindgen/x-ffi"

      - name: "Install C2CS"
        shell: bash
        run: dotnet tool install --global bottlenoselabs.C2CS.Tool

      - name: "Generate C# code"
        shell: bash
        run: cd ./bindgen && ./generate.sh

      - name: "Upload generated C# code"
        uses: actions/upload-artifact@v4
        with:
          name: "bindgen-cs"
          path: "./src/cs/production/Tracy/Generated"
